services:
  - type: web
    name: ai-research-assistant-api
    runtime: python
    plan: free
    branch: production-hardening-2026
    autoDeploy: true
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_ACCESS_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.8-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LOCAL_EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: LOCAL_EMBEDDING_DIMENSION
        value: "384"
      - key: RAG_SAMPLES_DIR
        value: data/samples
      - key: QDRANT_PATH
        value: qdrant_storage
      - key: RAG_COLLECTION_NAME
        value: research_docs
      - key: DATABASE_URL
        value: sqlite:///./runtime/research_assistant.db
      - key: INDEX_ON_STARTUP
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_TOOL_ROUNDS
        value: "3"
      - key: LOG_LEVEL
        value: INFO
